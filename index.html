<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JACKERS</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#050405;
    --panel:#0b0b0c;
    --red:#ff2b2b;
    --muted:#9a9a9a;
    --glass: rgba(255,255,255,0.03);
    --glow: 0 0 16px rgba(255,43,43,0.85), 0 0 40px rgba(255,20,20,0.12);
  }

  html,body{
    height:100%;
    margin:0;
    background:linear-gradient(180deg,#040405 0%, #0b0b0f 70%);
    font-family:'Montserrat',sans-serif;
    overflow:hidden;
  }

  /* MAIN WRAPPER */
  .app{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }

  /* VORTEX BACKGROUND FOR FALLING CARDS */
  .vortex{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:0;
    filter:blur(1.5px);
    background:
      radial-gradient(circle at 50% 40%, rgba(255,20,20,0.03), transparent 20%),
      linear-gradient(180deg, rgba(0,0,0,0.45), rgba(0,0,0,0.75));
  }

  /* FALLING CARDS */
  .card {
    position:absolute;
    width:70px;
    height:95px;
    background:linear-gradient(180deg,#fff,#e7e7e7);
    border-radius:6px;
    box-shadow:0 6px 20px rgba(0,0,0,0.6);
    display:flex;
    align-items:center;
    justify-content:center;
    opacity:.9;
    font-weight:700;
  }
  .card .suit {
    font-size:22px;
  }

  /* SPLASH MIDDLE UI */
  .splash{
    position:relative;
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  /* ROTATING COIN */
  .coin-wrap{
    width:210px;
    height:210px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #111, #000);
    box-shadow:var(--glow);
    display:flex;
    justify-content:center;
    align-items:center;
    animation:spin 6s linear infinite;
  }
  @keyframes spin{
    0%{ transform: rotateY(0) }
    100%{ transform: rotateY(360deg) }
  }

  .coin-inner{
    width:140px;
    height:140px;
    border-radius:50%;
    background:linear-gradient(180deg,#0f0f0f,#050505);
    display:flex;
    justify-content:center;
    align-items:center;
    border:3px solid rgba(255,255,255,0.05);
  }

  /* GLITCH TEXT */
  .title{
    margin-top:18px;
    font-family:'Orbitron';
    font-size:36px;
    letter-spacing:6px;
    position:relative;
  }
  .glitch{
    position:relative;
  }
  .glitch::before,
  .glitch::after{
    content:attr(data-text);
    position:absolute;
    left:0;top:0;
  }
  .glitch::before{
    color:var(--red);
    transform:translate(2px,-1px);
    opacity:.7;
  }
  .glitch::after{
    color:#9df;
    transform:translate(-2px,1px);
    opacity:.4;
  }

  /* LOADER */
  .loader{
    margin-top:16px;
    width:290px;
    height:6px;
    background:rgba(255,255,255,0.05);
    border-radius:6px;
    overflow:hidden;
  }
  .loader .bar{
    width:40%;
    height:100%;
    background:linear-gradient(90deg, var(--red), #ff5c5c);
    animation:slide 2.8s linear infinite;
  }
  @keyframes slide{
    0%{left:-40%}
    50%{left:80%}
    100%{left:140%}
  }

</style>
</head>

<body>

<div class="app">

  <!-- FALLING CARDS BACKGROUND -->
  <div class="vortex" id="vortex"></div>

  <!-- SPLASH UI -->
  <div class="splash">

    <div class="coin-wrap">
      <div class="coin-inner">
        <img src="logo.png" style="width:110px;height:110px;object-fit:contain;">
      </div>
    </div>

    <div class="title">
      <div class="glitch" data-text="JACKERS">JACKERS</div>
    </div>

    <div style="color:#aaa; margin-top:6px; letter-spacing:1px; font-size:13px;">
      Your Money • Your Suit • Your Identity
    </div>

    <div class="loader"><div class="bar"></div></div>

  </div>

</div>

<script>
/* ------------------------------
   Falling Cards Engine (from YOUR index.html)
   MERGED EXACTLY as-is
-------------------------------- */
const vortex = document.getElementById('vortex');

function rand(min,max){return Math.random()*(max-min)+min;}

const suits = ['♥','♠','♣','♦'];
const colors = {'♥':'#ff2b2b','♦':'#ff2b2b','♠':'#111','♣':'#111'};

for(let i=0;i<28;i++){
  const c = document.createElement('div');
  c.className='card';

  const suit = suits[Math.floor(Math.random()*suits.length)];
  c.innerHTML = `<div class="suit" style="color:${colors[suit]}">${suit}</div>`;

  const size = rand(45,90);
  c.style.width = size+'px';
  c.style.height = Math.round(size*1.3)+'px';

  c.style.left = rand(-10,110) + '%';
  c.style.top = rand(-30,5) + '%';
  c.style.opacity = rand(0.4,0.95);
  vortex.appendChild(c);

  (function(card){
    const duration = rand(6000,13000);
    const delay = rand(0,2000);
    card.animate(
      [
        { transform:`translateY(0) rotate(${rand(-40,40)}deg)` },
        { transform:`translateY(120vh) rotate(${rand(90,360)}deg)`, opacity:0.15 }
      ],
      { duration, iterations:Infinity, delay, easing:'cubic-bezier(.2,.8,.2,1)' }
    );
  })(c);
}

/* Redirect to home page after splash (optional) */
setTimeout(()=>{ window.location.href = "home.html"; }, 3000);
</script>

</body>
</html>
