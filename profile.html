<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jackers: Profile</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cards.css">

<style>
:root{
  --bg:#050505;
  --panel:#0b0b0c;
  --red:#ff2b2b;
  --muted:#b6b6b6;
  --glass: rgba(255,255,255,0.03);
  --glow: 0 0 16px rgba(255,43,43,0.7), 0 0 40px rgba(255,20,20,0.15);
}

body{
  margin:0;
  background:linear-gradient(180deg,#040405 0%, #0c0c10 80%);
  color:#fff;
  font-family:'Montserrat',sans-serif;
  overflow-x:hidden;
}

.app{
  max-width:900px;
  margin:0 auto;
  padding:24px;
}

/* HEADER */
.header{
  text-align:center;
  margin-top:28px;
}

.avatar{
  width:130px;
  height:130px;
  border-radius:50%;
  margin:0 auto;
  background:linear-gradient(145deg,#111,#000);
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:var(--glow);
  border:1px solid rgba(255,255,255,0.04);
}

.avatar img{
  width:85px;
  opacity:0.85;
}

.username{
  margin-top:14px;
  font-size:22px;
  font-family:'Orbitron';
}

/* SUIT CARD */
.suit-card{
  margin-top:30px;
  padding:20px;
  background:var(--glass);
  border-radius:18px;
  border:1px solid rgba(255,255,255,0.05);
  box-shadow:var(--glow);
}

.suit-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.suit-symbol{
  font-size:40px;
  color:var(--red);
}

.suit-title{
  font-family:'Orbitron';
  font-size:24px;
}

.reason{
  margin-top:12px;
  color:var(--muted);
  font-size:14px;
}

/* METRIC BARS */
.metric{
  margin-top:22px;
}

.metric label{
  font-size:13px;
  color:var(--muted);
}

.bar{
  width:100%;
  height:10px;
  background:#202020;
  border-radius:10px;
  margin-top:6px;
  overflow:hidden;
}

.fill{
  height:100%;
  background:linear-gradient(90deg,var(--red),#ff5a5a);
  border-radius:10px;
}

/* STREAK CARD */
.streak{
  margin-top:28px;
  background:var(--glass);
  padding:20px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,0.04);
}

.streak h3{
  margin:0;
  font-family:'Orbitron';
  font-size:18px;
  margin-bottom:8px;
}

.streak span{
  font-size:14px;
  color:var(--muted);
}

/* PERSONALITY TAG */
.personality{
  margin-top:28px;
  background:#0d0d0e;
  padding:16px;
  border-radius:14px;
  text-align:center;
  border:1px solid rgba(255,255,255,0.05);
}

.personality h3{
  font-family:'Orbitron';
  font-size:18px;
}

.personality p{
  font-size:14px;
  color:var(--muted);
}

/* NAV */
.navbar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:65px;
  backdrop-filter:blur(8px);
  background:rgba(0,0,0,0.55);
  border-top:1px solid rgba(255,255,255,0.06);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  cursor:pointer;
}

.nav-item:hover{
  color:var(--red);
}

.nav-item.active{
  color:var(--red);
}
</style>
</head>

<body>

  <div class="vortex"></div>

<div class="app">

  <!-- PROFILE HEADER -->
  <div class="header">
    <div class="avatar">
      <img src="logo.png" alt="">
    </div>
    <div class="username">Anushka</div>
  </div>

  <!-- SUIT CARD -->
  <div class="suit-card">
    <div class="suit-top">
      <div class="suit-symbol">♦</div>
      <div class="suit-title">Diamond Suit</div>
    </div>

    <div class="reason">
      Assigned based on:  
      <br>• High savings ratio  
      <br>• Low impulsive spending  
      <br>• Excellent month-to-month discipline  
    </div>

    <!-- METRICS -->
    <div class="metric">
      <label>Savings</label>
      <div class="bar"><div class="fill" style="width:92%"></div></div>
    </div>

    <div class="metric">
      <label>Spending Control</label>
      <div class="bar"><div class="fill" style="width:78%"></div></div>
    </div>

    <div class="metric">
      <label>Financial Discipline</label>
      <div class="bar"><div class="fill" style="width:88%"></div></div>
    </div>
  </div>

  <!-- STREAK -->
  <div class="streak">
    <h3>Streak: 41 Days</h3>
    <span>Consistent budgeting & tracking</span>
  </div>

  <!-- PERSONALITY TAG -->
  <div class="personality">
    <h3>Your Personality</h3>
    <p>Steady • Smart • Disciplined  
    <br>You make decisions based on logic not impulse.</p>
  </div>

</div>

<!-- NAV -->
<div class="navbar">
  <div class="nav-item" onclick="location.href='home.html'">Home</div>
  <div class="nav-item" onclick="location.href='suits.html'">Suits</div>
  <div class="nav-item" onclick="location.href='jokers.html'">Jokers</div>
  <div class="nav-item active" onclick="location.href='profile.html'">Profile</div>
</div>

<script src="cards.js"></script>
<script>
initFallingCards();
</script>

</body>
</html>
