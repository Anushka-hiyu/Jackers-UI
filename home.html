<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jackers: Home</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cards.css">

<style>
:root{
  --bg:#050505;
  --panel:#0b0b0c;
  --red:#ff2b2b;
  --muted:#b6b6b6;
  --glass: rgba(255,255,255,0.03);
  --glow: 0 0 16px rgba(255,43,43,0.85), 0 0 40px rgba(255,20,20,0.12);
}

body{
  margin:0;
  background:linear-gradient(180deg,#040405 0%, #0b0b0f 75%);
  color:#fff;
  font-family:'Montserrat',sans-serif;
  overflow-x:hidden;
}

.app{
  max-width:1000px;
  margin:0 auto;
  padding:24px;
}

/* TOP BAR */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.brand-icon{
  width:55px;
  height:55px;
  border-radius:50%;
  background:linear-gradient(145deg,#0a0a0a,#000);
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:var(--glow);
}

.brand-icon img{
  width:42px;
  height:42px;
  object-fit:contain;
}

.brand h1{
  margin:0;
  font-family:'Orbitron';
  letter-spacing:1.2px;
  font-size:22px;
}

/* SUIT BADGE */
.suit-badge{
  background:linear-gradient(145deg,#0d0d0d,#000);
  padding:14px 18px;
  border-radius:12px;
  box-shadow:var(--glow);
  border:1px solid rgba(255,255,255,0.03);
  display:flex;
  align-items:center;
  gap:12px;
}

.suit-symbol{
  font-size:24px;
  color:var(--red);
}

.suit-info span{
  font-size:12px;
  color:var(--muted);
}

.suit-info .score{
  font-family:'Orbitron';
  margin-top:3px;
  font-size:16px;
}

/* GRID FEATURES */
.grid{
  margin-top:28px;
  display:grid;
  gap:20px;
  grid-template-columns:repeat(3,1fr);
}

.feature{
  background:var(--glass);
  border:1px solid rgba(255,255,255,0.04);
  padding:18px;
  border-radius:14px;
  min-height:120px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  transition:0.3s;
  position:relative;
}

.feature:hover{
  transform:translateY(-6px);
  box-shadow:0 18px 40px rgba(0,0,0,0.6);
}

.feature h3{
  margin:0;
  font-family:'Orbitron';
  letter-spacing:1px;
  font-size:16px;
}

.feature p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:13px;
}

.feature button{
  align-self:flex-end;
  margin-top:10px;
  background:linear-gradient(90deg,var(--red),#ff5a5a);
  border:none;
  padding:8px 12px;
  color:#fff;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.badge{
  position:absolute;
  top:12px;
  right:12px;
  background:rgba(255,255,255,0.04);
  padding:6px 10px;
  border-radius:8px;
  font-size:11px;
}

/* NAVIGATION BAR */
.navbar{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  height:65px;
  backdrop-filter:blur(8px);
  background:rgba(0,0,0,0.55);
  border-top:1px solid rgba(255,255,255,0.06);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-item{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  cursor:pointer;
  transition:0.2s;
}

.nav-item:hover{
  color:var(--red);
}

.nav-item.active{
  color:var(--red);
}

/* RESPONSIVE */
@media(max-width:800px){
  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

  <div class="vortex"></div>

<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">
        <img src="logo.png" alt="Jackers">
      </div>
      <h1>JACKERS</h1>
    </div>

    <div class="suit-badge">
      <div class="suit-symbol">♦</div>
      <div class="suit-info">
        <span>Your Suit</span>
        <div class="score">Diamond</div>
      </div>
    </div>
  </div>

  <!-- FEATURES GRID -->
  <div class="grid">
    <div class="feature">
      <h3>Track Spending</h3>
      <p>Visual breakdown of where your money goes.</p>
      <button onclick="location.href='profile.html'">Open</button>
      <div class="badge">Insights</div>
    </div>

    <div class="feature">
      <h3>Weekly Challenges</h3>
      <p>Compete & earn bonus Jokers.</p>
      <button onclick="location.href='challenges.html'">Join</button>
      <div class="badge">4 Active</div>
    </div>

    <div class="feature">
      <h3>Jokers Wallet</h3>
      <p>Earn and redeem Jokers Coins.</p>
      <button onclick="location.href='jokers.html'">View</button>
      <div class="badge">Wallet</div>
    </div>
  </div>
</div>

<!-- NAV BAR -->
<div class="navbar">
  <div class="nav-item active" onclick="location.href='home.html'">Home</div>
  <div class="nav-item" onclick="location.href='suits.html'">Suits</div>
  <div class="nav-item" onclick="location.href='jokers.html'">Jokers</div>
  <div class="nav-item" onclick="location.href='profile.html'">Profile</div>
  <div class="nav-item" onclick="location.href='settings.html'">Settings</div>
</div>

<script src="cards.js"></script>
<script>
initFallingCards();
</script>

</body>
</html>
